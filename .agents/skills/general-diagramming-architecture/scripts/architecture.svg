  <rect x="652" y="348" width="274" height="104" rx="12" fill="#FFFFFF" stroke="#A9C6F5" stroke-width="1.6"/><circle cx="678" cy="374" r="13" fill="#2563EB"/><text x="678" y="379" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="700" y="377" font-size="16" font-weight="700" fill="#2563EB">Authorization</text><text x="668" y="398" font-size="13" font-weight="400" fill="#5A7085">one decision point per action</text><text x="668" y="416" font-size="13" font-weight="400" fill="#5A7085">denies by default</text>
