  <title id="title">Example service — architecture</title>
  <desc id="desc">Three bands. Callers (browser app, scheduled jobs) reach the service over HTTPS. The service band owns the HTTP router, domain services, authorization, and an outbox worker. The backing band holds Postgres, an object store, and a queue, reached only from the service band.</desc>
