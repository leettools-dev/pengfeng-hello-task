  <rect x="835" y="300" width="397" height="34" rx="17" fill="#FFFFFF" stroke="#A9C6F5" stroke-width="2"/><text x="852" y="323" font-size="15" font-weight="700" fill="#2563EB">2 · Service — owns request handling and policy</text>
